<style>
/* Layout: one narrow column like a flashcard; a highlighter-yellow strip marks what matters */
:root{
  --paper:#eef2f8; --card:#ffffff; --ink:#18243f; --muted:#5d6b86; --line:#d5dceb;
  --marker:#ffd43b; --marker-ink:#18243f; --blue:#2d5be3;
  --good:#1f9d61; --good-bg:#e3f6ec; --bad:#d8423a; --bad-bg:#fde8e6;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-word:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --card:#1b2437; --ink:#e9eef8; --muted:#9aa7c2; --line:#2e3a54;
  --marker:#f5c518; --marker-ink:#141b2c; --blue:#7c9dff;
  --good:#4fd18f; --good-bg:#16352a; --bad:#ff7b72; --bad-bg:#3d1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --card:#1b2437; --ink:#e9eef8; --muted:#9aa7c2; --line:#2e3a54;
  --marker:#f5c518; --marker-ink:#141b2c; --blue:#7c9dff;
  --good:#4fd18f; --good-bg:#16352a; --bad:#ff7b72; --bad-bg:#3d1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:900px}
.brand{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);letter-spacing:.04em}
.brand b{color:var(--ink);font-weight:700}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,10vw,56px);line-height:1.05;margin:0;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 4px;color:inherit}
h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.sub{color:var(--muted);margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
label.lbl{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-size:12px}
.btn{font:inherit;font-weight:700;font-size:17px;padding:14px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--marker);color:var(--marker-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:13px;color:var(--muted)}
.rules div{border-top:2px solid var(--ink);padding-top:6px}
.rules b{display:block;color:var(--ink);font-size:15px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;align-self:center;padding:6px}

.hud{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.hud .q{font-family:var(--f-display);font-size:22px}
.hud .score{margin-left:auto;font-weight:700}
.combo{font-size:13px;font-weight:700;background:var(--marker);color:var(--marker-ink);padding:2px 10px;border-radius:999px}

.bar i{display:block;height:100%;background:var(--ink);width:100%;transform-origin:left}
.bar.low i{background:var(--bad)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:10px}
.qtype{align-self:center;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.prompt-word{font-family:var(--f-word);font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1.1;overflow-wrap:anywhere}
.prompt-kor{font-family:var(--f-display);font-size:clamp(28px,8vw,38px);line-height:1.2}
.ask{color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{font:inherit;font-size:17px;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center;min-width:0}
.opt .k{font-family:var(--f-word);font-weight:800;color:var(--muted);width:18px;flex:none}
.opt.en span:last-child{font-family:var(--f-word);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{min-height:48px;font-size:15px;text-align:center}
.feedback .t{font-weight:700}
.feedback.ok .t{color:var(--good)} .feedback.no .t{color:var(--bad)}
/* result */
.big{font-family:var(--f-display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:28px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400}
.stats span{font-size:12px;color:var(--muted)}
.wrong{display:flex;flex-direction:column;gap:8px}
.wrong .row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.wrong .row b{font-family:var(--f-word);font-weight:700}
.wrong .row .ex{grid-column:1/-1;font-size:13px;color:var(--muted)}
pre.code{white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:14px;background:var(--paper);border:1.5px dashed var(--line);border-radius:10px;padding:14px;margin:0;user-select:all}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 160px}
.toast{font-size:14px;color:var(--good);font-weight:700;min-height:20px;text-align:center}
/* teacher */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
td.words{font-family:var(--f-word);font-size:13px;min-width:180px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.no{background:var(--bad-bg);color:var(--bad)}
.freq{display:flex;flex-wrap:wrap;gap:8px}
.freq span{font-family:var(--f-word);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.freq span em{font-style:normal;font-family:var(--f-body);font-weight:700;color:var(--bad);margin-left:6px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
@media (max-width:420px){.rules{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
</style>

<script>
const SECTIONS = {ex01:'기출예제 01', ex02:'기출예제 02', p01:'Practice 01', p02:'Practice 02'};
const W = [
// 기출예제 01
['ex01','exclusively','오로지, 전적으로','solely, only, entirely','partially, inclusively','excessively (지나치게)'],

['ex01','fashion','방식','manner, way, mode','','passion (열정)'],
['ex01','stable','안정적인','steady, constant, secure','unstable, volatile','stale (신선하지 않은)'],
['ex01','ecological','생태학적인','environmental, natural','','economical (경제적인)'],
['ex01','validity','타당성','soundness, legitimacy, credibility','invalidity, falsity','variety (다양성)'],
['ex01','feature','특징','characteristic, trait, attribute','','future (미래)'],
['ex01','estimation','추정, 판단[평가]','assessment, judgment, appraisal','','esteem (존경)'],
['ex01','consistent','일치하는','compatible, coherent, in agreement','inconsistent, contradictory','constant (지속적인); insistent (고집하는)'],
['ex01','code','부호화하다','encode, encrypt, cipher','decode, decipher',''],
['ex01','accurately','정확하게','precisely, exactly, correctly','inaccurately, incorrectly','adequately (적절하게)'],
// 기출예제 02
['ex02','to the extent that','~하는 한','insofar as, as far as','','to the effect that (~라는 취지로)'],
['ex02','agent','행위자, 대리인','actor, operator, representative','','agenda (의제)'],
['ex02','percept','지각된 것, 인식 결과','perception, impression, sensation','','precept (교훈, 수칙); concept (개념)'],
['ex02','autonomy','자율성','independence, self-governance, self-determination','dependence, subordination','astronomy (천문학)'],
['ex02','rational','합리적인','reasonable, logical, sensible','irrational, illogical','rationale (근거, 이유)'],
['ex02','compensate','보상하다','make up for, offset, counterbalance','','complement (보완하다)'],
['ex02','partial','불완전한, 부분적인','incomplete, limited, fragmentary','complete, total, full','particle (입자)'],
['ex02','foresee','예측하다, 예견하다','predict, anticipate, foretell','','oversee (감독하다); forsake (버리다)'],
['ex02','purposefully','목적을 갖고','deliberately, intentionally, on purpose','aimlessly, accidentally',''],
['ex02','assistance','도움, 지원','help, aid, support','hindrance, obstruction','assistant (조수); resistance (저항)'],
['ex02','evolution','진화','development, progression, advancement','regression, devolution','revolution (혁명)'],
['ex02','reflex','반사 신경','reaction, response, instinct','','reflect (반사하다, 반영하다)'],
['ex02','artificial','인공의','synthetic, man-made, manufactured','natural, genuine','superficial (피상적인)'],
['ex02','sufficient','충분한','enough, adequate, ample','insufficient, deficient, inadequate','efficient (효율적인); proficient (능숙한)'],
// Practice 01
['p01','recognition','인식, 인지','identification, perception, awareness','','recommendation (추천)'],
['p01','prediction','예측','forecast, projection, prophecy','','predicament (곤경)'],
['p01','typical','전형적인, 대표적인','representative, characteristic, standard','atypical, unusual, exceptional','topical (시사적인)'],
['p01','phrase','악구를 나누다','articulate, shape, divide into phrases','','phase (단계); praise (칭찬하다)'],
['p01','sight-read','악보를 처음 보며 연주하다','play at sight, read at sight','rehearse, memorize',''],
['p01','composer','작곡가','songwriter, musician','','composure (침착, 평정)'],
['p01','accuracy','정확성','precision, correctness, exactness','inaccuracy, error','adequacy (적절함)'],
['p01','accumulate','축적하다, 모으다','amass, gather, collect','disperse, scatter, dissipate','accommodate (수용하다)'],
['p01','disrupt','방해하다, 지장을 주다','interrupt, disturb, interfere with','facilitate, aid','erupt (분출하다); corrupt (타락시키다)'],
['p01','accomplishment','성과, 성취','achievement, attainment, feat','failure','accompaniment (반주)'],
['p01','expectation','기대','anticipation, hope, prospect','','expiration (만료)'],
// Practice 02
['p02','fortune','부, 재산','wealth, riches, assets','poverty','fortitude (불굴의 용기)'],
['p02','theft','절도','stealing, robbery, larceny','','thrift (절약)'],
['p02','legal','합법적인','lawful, legitimate, permissible','illegal, unlawful, illicit','regal (왕의, 위엄 있는)'],
['p02','pocket','분야','area, sector, niche, segment','',''],
['p02','routine','틀에 박힌 연기','act, performance, set piece','','route (경로)'],
['p02','numerous','수많은','many, countless, abundant','few, scarce','numerical (수의, 숫자로 나타낸)'],
['p02','vibrant','활발한','lively, dynamic, energetic','dull, lifeless, stagnant','vibrate (진동하다)'],
['p02','unrestricted','제한 없는','unlimited, free, unrestrained','restricted, limited, controlled',''],
['p02','ownership','소유권','possession, title, proprietorship','','hardship (고난)'],
['p02','reap','거두다, 수확하다','harvest, gather, gain','sow','leap (뛰다); rip (찢다)'],
['p02','sow','씨앗을 뿌리다','plant, seed, scatter','reap, harvest','sew (바느질하다); saw (톱질하다)'],
['p02','sew','바느질하다','stitch, tailor, mend','','sow (씨앗을 뿌리다); sue (고소하다)'],
['p02','high-end','고급의','upscale, luxury, premium','low-end, budget, cheap',''],
['p02','fashion house','(유명 디자이너의) 의상실','couture house, design house, label','',''],
['p02','legislation','법률, 법률 제정','law, lawmaking, statute','','legislature (입법부); litigation (소송)'],
['p02','file','(소송을) 제기하다','bring, lodge, submit','withdraw, drop',''],
].map(([s,w,m,syn,ant,conf])=>({s,w,m,
  syn:syn?syn.split(', '):[], ant:ant?ant.split(', '):[],
  conf:conf?conf.split('; ').map(c=>{const i=c.indexOf(' (');return {w:c.slice(0,i),m:c.slice(i+2,-1)}}):[]}));

// words too close in meaning to serve as each other's distractors
const CLUSTERS = [
 ['ample','abundant','enough','adequate','many','countless','plentiful'],
 ['predict','foresee','forecast','anticipate','anticipation','projection','foretell','prophecy','prospect','hope'],
 ['perception','impression','sensation','awareness','recognition','identification'],
 ['aid','help','support','assistance','facilitate'],
 ['characteristic','trait','attribute','representative','standard'],
 ['precisely','exactly','correctly','precision','correctness','exactness'],
 ['gather','collect','amass','harvest','gain','reap'],
 ['limited','incomplete','restricted','controlled','fragmentary'],
 ['development','progression','advancement'],
 ['law','statute','lawful','legitimate','legitimacy','permissible','lawmaking'],
 ['disturb','interrupt','interfere with','hindrance','obstruction'],
 ['reaction','response','instinct'],
 ['manner','way','mode'],
 ['act','performance','set piece'],
 ['inaccurately','incorrectly','inaccuracy','error'],
 ['few','scarce'], ['dull','lifeless','stagnant'], ['illegal','unlawful','illicit'],
 ['scatter','disperse','dissipate','plant','seed','sow'],
 ['natural','genuine','environmental'],
 ['deliberately','intentionally','on purpose'],
 ['unlimited','free','unrestrained'],
 ['lively','dynamic','energetic'],
 ['complete','total','full'],
];
const near=(a,b)=>a===b||CLUSTERS.some(c=>c.includes(a)&&c.includes(b));

const SALT='yes-qn30-2026';
function hash(str){let h=5381;for(const ch of str+SALT){h=((h<<5)+h+ch.codePointAt(0))>>>0}
  let h2=0x9e3779b9;for(const ch of SALT+str){h2=Math.imul(h2^ch.codePointAt(0),2654435761)>>>0}
  return ((h^h2)>>>0).toString(36).toUpperCase().padStart(6,'0').slice(-6)}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function makeQuestion(t){
  const others=shuffle(W.filter(x=>x!==t));
  const types=['meaning','meaning','word','word','syn','syn'];
  if(t.ant.length) types.push('ant');
  const type=pick(types);
  let answer, opts=[];
  const addOpts=(pool,n)=>{for(const p of pool){if(opts.length>=n)break;if(!opts.includes(p)&&p!==answer)opts.push(p)}};
  if(type==='meaning'){
    answer=t.m;
    const key=t.m.replace(/[()\[\]~]/g,'').slice(0,2);
    addOpts(others.filter(o=>!o.m.replace(/[()\[\]~]/g,'').startsWith(key)).map(o=>o.m),3);
  }else if(type==='word'){
    answer=t.w;
    const confs=shuffle(t.conf.map(c=>c.w)).slice(0,2);
    const key=t.m.slice(0,2);
    addOpts(confs,2); addOpts(others.filter(o=>!o.m.startsWith(key)).map(o=>o.w),3);
  }else if(type==='syn'){
    answer=pick(t.syn);
    const pool=shuffle(others.flatMap(o=>o.syn.concat(o.ant)))
      .filter(d=>!t.syn.some(s=>near(s,d))&&!near(d,t.w));
    addOpts(pool,3);
  }else{
    answer=pick(t.ant);
    const pool=shuffle(t.syn).concat(shuffle(others.flatMap(o=>o.ant.concat(o.syn))))
      .filter(d=>!t.ant.some(a=>near(a,d))&&d!==t.w);
    addOpts(pool,3);
  }
  return {t,type,answer,options:shuffle([answer,...opts.slice(0,3)])};
}

const S={screen:'start',name:store.get('qn30-name')||'',secs:new Set(Object.keys(SECTIONS)),len:20,
  qs:[],i:0,correct:0,score:0,combo:0,best:0,wrong:[],locked:false,timer:null,start:0,used:0,finishedAt:null,paste:''};
const QTIME=15000;
const app=document.getElementById('app');

function pool(){return W.filter(w=>S.secs.has(w.s))}
function scopeLabel(){const k=Object.keys(SECTIONS).filter(k=>S.secs.has(k));
  return k.length===4?'전체 (기출01~P02)':k.map(x=>SECTIONS[x]).join(', ')}

function render(){
  clearInterval(S.timer);
  if(S.screen==='start') renderStart();
  else if(S.screen==='play') renderPlay();
  else if(S.screen==='result') renderResult();
  else renderTeacher();
  window.scrollTo(0,0);
}

function brand(){return `<div class="brand"><span><b>예스영어</b> · 신도고2 올림포스</span><span>QN 30</span></div>`}

function renderStart(){
  const n=pool().length;
  app.innerHTML=`<div class="wrap">
    ${brand()}
    <div><h1>QN30 <span class="hl">단어 레이스</span></h1>
    <p class="sub">기출예제 01부터 Practice 02까지, 단어 ${W.length}개로 뜻·동의어·반의어·혼동어를 빠르게 맞혀 보세요.</p></div>
    <div class="panel">
      <label class="lbl" for="nm">이름</label>
      <input type="text" id="nm" placeholder="예: 김민수" maxlength="12" value="${esc(S.name)}" autocomplete="off">
      <span class="lbl">범위</span>
      <div class="chips" id="secs">${Object.entries(SECTIONS).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${S.secs.has(k)}">${v}<span class="n">${W.filter(w=>w.s===k).length}</span></button>`).join('')}</div>
      <span class="lbl">문제 수</span>
      <div class="chips" id="lens">${[10,20,0].map(l=>`<button class="chip" data-l="${l}" aria-pressed="${S.len===l}">${l?l+'문제':'모두 ('+n+')'}</button>`).join('')}</div>
      <button class="btn" id="go" ${(!S.name.trim()||!n)?'disabled':''}>시작하기</button>
    </div>
    <div class="rules">
      <div><b>15초</b>문제마다 제한 시간</div>
      <div><b>빨리 맞히면</b>시간 보너스 점수</div>
      <div><b>연속 정답</b>콤보 보너스</div>
    </div>
    <button class="link" id="tch">선생님 결과 확인</button>
  </div>`;
  const nm=document.getElementById('nm'),go=document.getElementById('go');
  nm.oninput=()=>{S.name=nm.value;go.disabled=!S.name.trim()||!pool().length};
  document.getElementById('secs').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
    const k=b.dataset.k; if(S.secs.has(k)) S.secs.delete(k); else S.secs.add(k); renderStart(); document.getElementById('nm').focus()};
  document.getElementById('lens').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;S.len=+b.dataset.l;renderStart()};
  go.onclick=startGame;
  nm.onkeydown=e=>{if(e.key==='Enter'&&!go.disabled)startGame()};
  document.getElementById('tch').onclick=()=>{S.screen='teacher';render()};
}

function startGame(){
  S.name=S.name.trim(); store.set('qn30-name',S.name);
  const p=shuffle(pool()); const n=S.len?Math.min(S.len,p.length):p.length;
  S.qs=p.slice(0,n).map(makeQuestion); S.i=0;S.correct=0;S.score=0;S.combo=0;S.best=0;S.wrong=[];S.used=0;
  S.screen='play'; render();
}

const TYPE_LABEL={meaning:'뜻 고르기',word:'단어 고르기',syn:'동의어',ant:'반의어'};
function renderPlay(){
  const q=S.qs[S.i]; S.locked=false;
  let promptHtml;
  if(q.type==='meaning') promptHtml=`<div class="prompt-word">${esc(q.t.w)}</div><div class="ask">이 단어의 뜻은?</div>`;
  else if(q.type==='word') promptHtml=`<div class="prompt-kor">${esc(q.t.m)}</div><div class="ask">이 뜻을 가진 단어는? <br>비슷하게 생긴 단어에 주의!</div>`;
  else if(q.type==='syn') promptHtml=`<div class="prompt-word">${esc(q.t.w)}</div><div class="ask">${esc(q.t.m)} · <b>동의어</b>로 알맞은 것은?</div>`;
  else promptHtml=`<div class="prompt-word">${esc(q.t.w)}</div><div class="ask">${esc(q.t.m)} · <b>반의어</b>로 알맞은 것은?</div>`;
  const en=q.type!=='meaning';
  app.innerHTML=`<div class="wrap">
    ${brand()}
    <div class="hud"><span class="q">${S.i+1} / ${S.qs.length}</span>${S.combo>=2?`<span class="combo">${S.combo} 콤보</span>`:''}<span class="score">${S.score.toLocaleString()}점</span></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="qcard pop"><span class="qtype">${TYPE_LABEL[q.type]} · ${SECTIONS[q.t.s]}</span>${promptHtml}</div>
    <div class="opts">${q.options.map((o,k)=>`<button class="opt ${en?'en':''}" data-v="${esc(o)}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
  </div>`;
  document.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(b)answer(b.dataset.v)};
  S.start=performance.now();
  const fill=document.getElementById('fill'),bar=document.getElementById('bar');
  S.timer=setInterval(()=>{const left=Math.max(0,QTIME-(performance.now()-S.start));
    fill.style.transform=`scaleX(${left/QTIME})`; bar.classList.toggle('low',left<4000);
    if(left<=0) answer(null)},100);
}

function answer(v){
  if(S.locked)return; S.locked=true; clearInterval(S.timer);
  const q=S.qs[S.i], el=performance.now()-S.start; S.used+=Math.min(el,QTIME);
  const ok=v===q.answer;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
    if(b.dataset.v===q.answer)b.classList.add('ok'); else if(b.dataset.v===v)b.classList.add('no')});
  const fb=document.getElementById('fb');
  if(ok){S.correct++;S.combo++;S.best=Math.max(S.best,S.combo);
    const bonus=Math.round(50*(1-el/QTIME)), cb=Math.min(S.combo-1,5)*10;
    S.score+=100+bonus+cb;
    fb.className='feedback ok';fb.innerHTML=`<span class="t">정답!</span> +${100+bonus+cb}점`;
  }else{S.combo=0;S.wrong.push(q);
    fb.className='feedback no';fb.innerHTML=`<span class="t">${v===null?'시간 초과':'아쉬워요'}</span><br><b style="font-family:var(--f-word)">${esc(q.t.w)}</b> = ${esc(q.t.m)}${q.t.conf.length?` · 혼동어 ${q.t.conf.map(c=>esc(c.w)).join(', ')}`:''}`;
  }
  const hud=document.querySelector('.hud .score');if(hud)hud.textContent=S.score.toLocaleString()+'점';
  setTimeout(()=>{S.i++; if(S.i>=S.qs.length){S.finishedAt=new Date();S.screen='result'} render()}, ok?800:2200);
}

function fmtDate(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function wrongWords(){return [...new Set(S.wrong.map(q=>q.t.w))]}
function resultText(){
  const total=S.qs.length, pct=Math.round(S.correct/total*100), when=fmtDate(S.finishedAt);
  const ww=wrongWords().join(', ')||'없음', scope=scopeLabel();
  const code=hash([S.name,S.correct,total,scope,when,ww,S.score].join('|'));
  return `[예스영어 QN30 단어게임 결과]
이름: ${S.name}
점수: ${S.correct} / ${total} (${pct}%)
게임점수: ${S.score}
범위: ${scope}
일시: ${when}
틀린 단어: ${ww}
확인코드: ${code}`;
}

function renderResult(){
  const total=S.qs.length, pct=Math.round(S.correct/total*100);
  const msg=pct===100?'완벽해요! 시험 준비 끝.':pct>=85?'아주 좋아요. 틀린 것만 다시 보면 됩니다.':pct>=60?'괜찮아요. 아래 단어를 한 번 더 외워요.':'다시 한 판 해 볼까요? 반복하면 금방 늘어요.';
  const txt=resultText();
  const uniq=[...new Map(S.wrong.map(q=>[q.t.w,q.t])).values()];
  app.innerHTML=`<div class="wrap">
    ${brand()}
    <div class="panel pop">
      <span class="lbl">${esc(S.name)} 학생의 결과</span>
      <div class="big">${S.correct}<small> / ${total}</small></div>
      <p class="sub">${msg}</p>
      <div class="stats">
        <div><b>${pct}%</b><span>정답률</span></div>
        <div><b>${S.score.toLocaleString()}</b><span>게임 점수</span></div>
        <div><b>${S.best}</b><span>최고 콤보</span></div>
      </div>
    </div>
    <div class="panel">
      <h2>선생님께 보내기</h2>
      <p class="sub" style="font-size:14px">아래 결과를 복사해서 카톡으로 선생님께 보내 주세요. 확인코드가 있어야 인정돼요.</p>
      <pre class="code" id="code">${esc(txt)}</pre>
      <button class="btn" id="copy">결과 복사하기</button>
      <div class="toast" id="toast" aria-live="polite"></div>
    </div>
    ${uniq.length?`<div class="panel"><h2>틀린 단어 다시 보기</h2><div class="wrong">${uniq.map(t=>`<div class="row"><b>${esc(t.w)}</b><span>${esc(t.m)}</span>
      <span class="ex">동의어 ${esc(t.syn.join(', '))}${t.ant.length?` · 반의어 ${esc(t.ant.join(', '))}`:''}${t.conf.length?` · 혼동어 ${t.conf.map(c=>esc(c.w+' ('+c.m+')')).join(', ')}`:''}</span></div>`).join('')}</div></div>`:''}
    <div class="row-btns">
      ${uniq.length?`<button class="btn ghost" id="retryWrong">틀린 단어만 다시</button>`:''}
      <button class="btn ghost" id="again">처음으로</button>
    </div>
  </div>`;
  document.getElementById('copy').onclick=()=>{
    const t=document.getElementById('toast');
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('code'));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='텍스트를 선택했어요. 길게 눌러 복사하세요.'};
    try{navigator.clipboard.writeText(txt).then(()=>{t.textContent='복사했어요! 카톡에 붙여넣기 하세요.'},fallback)}catch(e){fallback()}
  };
  document.getElementById('again').onclick=()=>{S.screen='start';render()};
  const rw=document.getElementById('retryWrong');
  if(rw) rw.onclick=()=>{S.qs=shuffle(uniq).map(makeQuestion);S.i=0;S.correct=0;S.score=0;S.combo=0;S.best=0;S.wrong=[];S.screen='play';render()};
}

function parseResults(text){
  const blocks=text.split(/\[?예스영어 QN30 단어게임 결과\]?/).slice(1);
  return blocks.map(b=>{
    const g=k=>{const m=b.match(new RegExp(k+'\\s*:\\s*(.*)'));return m?m[1].trim():''};
    const name=g('이름'), sc=g('점수').match(/(\d+)\s*\/\s*(\d+)/), game=g('게임점수'), scope=g('범위'), when=g('일시'), ww=g('틀린 단어'), code=g('확인코드');
    if(!sc) return null;
    const correct=+sc[1], total=+sc[2];
    const valid=hash([name,correct,total,scope,when,ww,+game].join('|'))===code.toUpperCase();
    return {name,correct,total,pct:Math.round(correct/total*100),scope,when,ww:ww==='없음'?[]:ww.split(/,\s*/),valid};
  }).filter(Boolean);
}

function sampleResults(){
  const mk=(name,correct,total,score,when,ww)=>{const scope='전체 (기출01~P02)',w=ww.join(', ')||'없음';
    return `[예스영어 QN30 단어게임 결과]\n이름: ${name}\n점수: ${correct} / ${total} (${Math.round(correct/total*100)}%)\n게임점수: ${score}\n범위: ${scope}\n일시: ${when}\n틀린 단어: ${w}\n확인코드: ${hash([name,correct,total,scope,when,w,score].join('|'))}`};
  return [mk('예시학생A',18,20,2410,'2026-10-24 19:02',['percept','sow']),
          mk('예시학생B',15,20,1890,'2026-10-24 19:10',['percept','validity','reflex','sew','compensate']),
          mk('예시학생C',20,20,2870,'2026-10-24 19:15',[])].join('\n\n');
}

function renderTeacher(){
  const rows=parseResults(S.paste).sort((a,b)=>b.pct-a.pct||b.correct-a.correct);
  const freq={}; rows.filter(r=>r.valid).forEach(r=>r.ww.forEach(w=>freq[w]=(freq[w]||0)+1));
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const avg=rows.length?Math.round(rows.filter(r=>r.valid).reduce((s,r)=>s+r.pct,0)/Math.max(1,rows.filter(r=>r.valid).length)):0;
  app.innerHTML=`<div class="wrap wide">
    ${brand()}
    <div><h1>결과 <span class="hl">확인</span></h1>
    <p class="sub">학생들이 카톡으로 보낸 결과를 아래 칸에 한꺼번에 붙여넣으세요. 확인코드로 조작 여부를 검사해서 표로 정리합니다.</p></div>
    <div class="panel">
      <label class="lbl" for="paste">학생 결과 붙여넣기</label>
      <textarea id="paste" rows="7" placeholder="[예스영어 QN30 단어게임 결과]&#10;이름: …&#10;점수: … 여러 명 결과를 그대로 붙여넣어도 됩니다.">${esc(S.paste)}</textarea>
      <div class="row-btns"><button class="btn ghost" id="sample">예시 결과 넣어보기</button><button class="btn ghost" id="clear">지우기</button></div>
    </div>
    ${rows.length?`
    <div class="stats"><div><b>${rows.length}명</b><span>제출</span></div><div><b>${avg}%</b><span>평균 정답률 (인증된 결과)</span></div><div><b>${rows.filter(r=>!r.valid).length}</b><span>코드 불일치</span></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>이름</th><th>점수</th><th>정답률</th><th>틀린 단어</th><th>범위</th><th>일시</th><th>확인</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.correct}/${r.total}</td><td>${r.pct}%</td><td class="words">${esc(r.ww.join(', ')||'–')}</td><td>${esc(r.scope)}</td><td style="white-space:nowrap">${esc(r.when)}</td><td>${r.valid?'<span class="pill ok">인증</span>':'<span class="pill no">코드 불일치</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    ${top.length?`<div class="panel"><h2>많이 틀린 단어</h2><div class="freq">${top.map(([w,c])=>`<span>${esc(w)}<em>${c}명</em></span>`).join('')}</div></div>`:''}
    `:`<div class="empty">붙여넣은 결과가 여기에 표로 정리됩니다. 결과 형식이 처음이라면 ‘예시 결과 넣어보기’를 눌러 보세요.</div>`}
    <button class="link" id="back">학생 화면으로</button>
  </div>`;
  const ta=document.getElementById('paste');
  ta.oninput=()=>{S.paste=ta.value;clearTimeout(ta._t);ta._t=setTimeout(()=>{const pos=ta.selectionStart;renderTeacher();const n=document.getElementById('paste');n.focus();n.setSelectionRange(pos,pos)},500)};
  document.getElementById('sample').onclick=()=>{S.paste=sampleResults();renderTeacher()};
  document.getElementById('clear').onclick=()=>{S.paste='';renderTeacher()};
  document.getElementById('back').onclick=()=>{S.screen='start';render()};
}

if(location.hash==='#teacher') S.screen='teacher';
render();
</script>
